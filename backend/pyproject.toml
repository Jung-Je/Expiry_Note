[project]
name = "expiry-note-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.11",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg[binary]>=3.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Auto-generated by Django, not hand-written — don't lint their formatting.
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Django's `startapp` boilerplate keeps these imports for convenience even
# before models/tests are written.
"**/admin.py" = ["F401"]
"**/models.py" = ["F401"]
"**/tests.py" = ["F401"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
# apps/_template is a copy-only scaffold, never registered in INSTALLED_APPS —
# its example test isn't runnable as-is, so keep it out of collection.
norecursedirs = [".venv", "apps/_template"]
