name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expiry_note_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: expiry_note_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      # scripts/check-all.sh는 로컬 커밋 전용으로 format.sh를 그대로 호출해
      # 파일을 고쳐버린다 — CI 러너에서 고친 내용은 저장되지 않고 사라지므로
      # 그대로 쓰면 포맷 안 된 코드가 절대 실패하지 않는다. 그래서 CI는
      # --check로 고치지 않고 실패만 하도록 따로 돈다.
      - name: Format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Django check
        working-directory: backend
        run: uv run python manage.py check

      - name: Test + coverage
        run: scripts/test.sh

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test
