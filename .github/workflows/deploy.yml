name: Deploy backend

# main에 push(= PR merge)될 때마다, 백엔드/배포 설정에 영향 있는 파일이
# 바뀐 경우에만 운영 서버에 SSH로 접속해서 최신 코드를 받아 재배포한다.
# CI(ci.yml)가 같은 push에서 별도로 돌아가지만, 여긴 CI 통과 여부를
# 기다리지 않는다 — main으로 머지되는 PR은 브랜치 보호 규칙으로 이미
# CI 통과를 요구하고 있다는 전제(아직 설정 안 했다면 GitHub 리포 Settings
# > Branches에서 "Require status checks to pass" 켜두는 걸 권장).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - "Caddyfile.example"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 서버 접속해 재배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/expiry-note
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
