services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: expiry_note
      POSTGRES_PASSWORD: expiry_note
      POSTGRES_DB: expiry_note
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expiry_note"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
